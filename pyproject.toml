[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpatch"
version = "0.1.0"
description = "Evidence-backed verification for AI coding claims"
requires-python = ">=3.10"

[project.optional-dependencies]
ethereum = ["web3>=7,<8"]

[tool.setuptools.packages.find]
include = ["proofpatch*"]
exclude = ["ui*", "contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
