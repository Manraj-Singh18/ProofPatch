<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProofPatch</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#e8edf2;background:#080b10}*{box-sizing:border-box}body{margin:0;min-height:100vh}main{width:min(1040px,94vw);margin:auto;padding:42px 0 70px}h1{font-size:38px;margin:0}.tag{color:#8f9baa;margin:8px 0 30px}.card{border:1px solid #27303b;background:#0e141b;border-radius:14px;padding:22px;margin-top:18px}.accepted{border-color:#315d48}.rejected{border-color:#613238}label{display:block;font-weight:650;margin:18px 0 8px}textarea,input{width:100%;background:#0a0f15;color:#e8edf2;border:1px solid #29333f;border-radius:9px;padding:12px;font:inherit}textarea{min-height:110px;resize:vertical}button{margin-top:16px;border:0;border-radius:9px;padding:12px 18px;font-weight:750;cursor:pointer;background:#e8edf2;color:#080b10}button:disabled{opacity:.5}.hidden{display:none}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.verdict{font-size:28px;font-weight:850}.verified{color:#7fe0aa}.rejected-text{color:#ff9b9b}.muted{color:#8f9baa;font-size:14px}.reason{margin-top:12px;padding:12px;border-radius:9px;background:#241317;color:#ffb2b2;font-size:14px}.timeline{display:grid;gap:9px;margin-top:20px}.step{display:flex;gap:12px;padding:13px;border:1px solid #242e39;border-radius:9px}.mark{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:850}.ok .mark{background:#173d2b;color:#7fe0aa}.bad .mark{background:#482026;color:#ff9b9b}.unknown .mark{background:#242d38;color:#aab4bf}.detail{color:#8f9baa;font-size:13px;margin-top:4px;white-space:pre-wrap;word-break:break-word}.commit{margin-top:18px;background:#090d12;border-radius:9px;padding:14px}.commit code{display:block;margin-top:7px;word-break:break-all;color:#d8e0e8}.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#7f8b99;font-weight:750}.evidence-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.evidence{border:1px solid #252f3a;border-radius:9px;padding:13px}.evidence pre{font-size:11px;line-height:1.45;max-height:190px;overflow:auto;white-space:pre-wrap;color:#b9c4cf}@media(max-width:700px){.evidence-grid{grid-template-columns:1fr}.hero{display:block}}
</style></head>
<body><main>
<h1>ProofPatch</h1><div class="tag">A local coding agent where the proof does not trust the model.</div>
<div class="card">
<label for="task">Task</label><textarea id="task">Fix the add() function so that test_add passes. Do not modify the test.</textarea>
<label for="repo">Repository</label><input id="repo" value="/Users/manraj/proofpatch-agent-test">
<button id="run">Run local agent</button>
</div>
<div id="result" class="card hidden"></div>
</main>
<script>
const API='http://127.0.0.1:8787',run=document.querySelector('#run'),result=document.querySelector('#result');
const ev=(r,k)=>(r?.evidence||[]).find(x=>x.kind===k);
function step(ok,title,detail=''){let c=ok===true?'ok':ok===false?'bad':'unknown',m=ok===true?'✓':ok===false?'!':'–';return `<div class="step ${c}"><div class="mark">${m}</div><div><strong>${title}</strong><div class="detail">${detail}</div></div></div>`}
function render(job){result.classList.remove('hidden');if(job.error){result.innerHTML=`<div class="hero"><div><div class="verdict rejected-text">RUN FAILED</div><div class="muted">${job.error}</div></div></div>`;return}const r=job.report;if(!r){result.innerHTML=`<div class="verdict">${job.status}</div>`;return}
const p=ev(r,'patch'),h=ev(r,'file-hashes'),a=ev(r,'patch-application'),pf=ev(r,'protected-files'),t=ev(r,'tests'),m=ev(r,'model-response'),integrity=ev(r,'integrity');
const tv=t?.value||{},av=a?.value||{},pv=pf?.value||{},hv=h?.value||{};
const patchOk=a?(av.applied_matches_proposal===true||av.matches_proposed===true):null;
const testsOk=t?(tv.exit_code===0&&tv.failed===0):null,protectedOk=pf?pv.unchanged===true:null,hashOk=h?Object.keys(hv.before||{}).length>0:null;
const policyViolation=integrity?.value?.violation||'';
const protectedViolation=policyViolation.toLowerCase().includes('test files')||policyViolation.toLowerCase().includes('protected');
result.className='card '+(r.accepted?'accepted':'rejected');
result.innerHTML=`<div class="hero"><div><div class="verdict ${r.accepted?'verified':'rejected-text'}">${r.accepted?'VERIFIED':'REJECTED'}</div><div class="muted">${r.accepted?'Every acceptance check passed.':'ProofPatch found evidence that prevents acceptance.'}</div>${policyViolation?`<div class="reason"><strong>Acceptance blocked:</strong> ${policyViolation}</div>`:''}</div><div class="muted">${r.attempts} attempt${r.attempts===1?'':'s'}</div></div>
<div class="timeline">
${step(m?true:null,'Model response recorded',m?'Recorded as untrusted input; model claims are never used as proof.':'No model-response evidence was returned on this run.')}
${step(p?true:null,'Proposed patch recorded',p?'Exact proposed edit retained in the evidence ledger.':'No patch evidence was retained before rejection.')}
${step(hashOk,'Actual file state recorded',hashOk?'Before/after SHA-256 hashes collected independently.':'Not reached before the run was rejected.')}
${step(patchOk,'Applied change matches proposal',a?JSON.stringify(av):'Not reached before the run was rejected.')}
${step(protectedOk,protectedViolation?'Protected-file policy enforced':'Protected files unchanged',protectedViolation?policyViolation:protectedOk?'Protected test files have identical before/after hashes.':'Not reached before the run was rejected.')}
${step(testsOk,'Tests independently executed',t?`${tv.passed??0} passed · ${tv.failed??0} failed · exit code ${tv.exit_code}`:'Not reached because verification rejected the edit before tests.')}
${step(r.accepted,'Proof accepted',r.claims?.map(c=>`${c.status}: ${c.assertion}`).join('\n')||'')}
</div>
<div class="commit"><strong>Cryptographic commitment</strong><code>${r.commitment}</code></div>
<div class="card"><div class="section-title">Evidence ledger</div><div class="evidence-grid">${(r.evidence||[]).map(x=>`<div class="evidence"><strong>${x.kind}</strong><pre>${JSON.stringify(x.value,null,2)}</pre></div>`).join('')}</div></div>`}
run.onclick=async()=>{run.disabled=true;result.classList.remove('hidden');result.className='card';result.innerHTML='<div class="verdict">RUNNING</div><div class="muted">Calling the localhost agent...</div>';try{let cr=await fetch(API+'/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:document.querySelector('#task').value,repo:document.querySelector('#repo').value})}),job=await cr.json();if(!cr.ok)throw Error(job.error||'could not create job');let rr=await fetch(API+'/jobs/'+job.id+'/run',{method:'POST'}),done=await rr.json();if(!rr.ok)throw Error(done.error||'agent run failed');render(done)}catch(e){result.className='card rejected';result.innerHTML=`<div class="verdict rejected-text">API ERROR</div><div class="muted">${e}</div>`}finally{run.disabled=false}};
</script></body></html>
